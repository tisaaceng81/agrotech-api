workflows:
  android-workflow:
    name: Android Workflow
    environment:
      flutter: stable
    scripts:
      - name: Gerar estrutura nativa do Android automaticamente
        script: |
          flutter create . --platforms=android
      - name: Injetar permissão de Internet automaticamente
        script: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
              with open(path, "w") as f:
                  f.write(content)
          '
      - name: Obter pacotes do pubspec
        script: |
          flutter pub get
      - name: Compilar o APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
