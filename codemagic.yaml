workflows:
  android-workflow:
    name: Compilar APK AgroTech
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Instalar dependências do Flutter
        script: flutter packages get
      - name: Construir APK Release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
